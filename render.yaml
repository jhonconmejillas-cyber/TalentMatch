# Render Blueprint: backend de TalentMatch (Spring Boot en una imagen Docker).
# Render lo lee al crear el servicio con "New -> Blueprint" y despliega cada push a main.
# Guia paso a paso: deploy/README.md
services:
  - type: web
    name: talentmatch-backend
    runtime: docker
    plan: free
    region: virginia
    branch: main
    # La imagen se construye desde la raiz porque necesita conf/ y database/
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Supabase: usar la cadena del connection pooler (IPv4), modo Session, puerto 5432.
      # Ej.: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Clave de firma del token (Render genera un valor aleatorio de mas de 32 caracteres)
      - key: JWT_SECRET
        generateValue: true
      # URL del frontend en Vercel (produccion y previews)
      - key: CORS_ORIGENES
        value: https://talentmatch.vercel.app,https://talentmatch-*.vercel.app
      # Solo migraciones: sin los usuarios de prueba. Para una demo con datos de prueba usar:
      # filesystem:/app/database/migrations,filesystem:/app/database/seeds
      - key: FLYWAY_LOCATIONS
        value: filesystem:/app/database/migrations
      # El plan gratuito tiene 512 MB de RAM
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
