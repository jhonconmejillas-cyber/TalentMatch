# Configuracion del analisis de SonarQube Cloud (https://sonarcloud.io)
# Lo usa el paso "Analisis de calidad en SonarQube Cloud" de .github/workflows/ci.yml
sonar.organization=jhonconmejillas-cyber
sonar.projectKey=jhonconmejillas-cyber_TalentMatch
sonar.projectName=TalentMatch

# Codigo fuente: backend (Java), frontend (HTML/CSS/JS), migraciones SQL y scripts
sonar.sources=backend/src/main,frontend,database,scripts
sonar.tests=backend/src/test/java
sonar.sourceEncoding=UTF-8

# Java: clases compiladas, version y reportes de pruebas y cobertura (JaCoCo)
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/**/*.jar
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Fuera de la cobertura: el arranque de Spring y las clases de solo datos (DTO y configuracion)
sonar.coverage.exclusions=**/TalentmatchApplication.java,**/dto/**,**/config/*Properties.java
