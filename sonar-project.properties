# Configuracion del analisis de SonarQube Cloud (https://sonarcloud.io)
# Lo usa el paso "Analisis de calidad en SonarQube Cloud" de .github/workflows/ci.yml.
# El scanner analiza todo el repositorio (backend Java, frontend JS, SQL y scripts) y detecta
# solo los archivos de prueba.
sonar.organization=jhonconmejillas-cyber
sonar.projectKey=jhonconmejillas-cyber_TalentMatch
sonar.projectName=TalentMatch
sonar.sourceEncoding=UTF-8

# Java: clases compiladas, version y reportes de pruebas y cobertura (JaCoCo)
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/**/*.jar
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Version de Python del script del informe de pruebas (scripts/reporte_pruebas.py)
sonar.python.version=3.12

# La cobertura se mide sobre el codigo de produccion del backend, que es donde vive la logica
# de negocio (las pruebas JUnit no ejecutan el frontend):
#  - backend/src/test/**: el codigo de las pruebas no se "cubre" a si mismo
#  - frontend/**: solo muestra lo que responde la API, no calcula ni decide nada (ver frontend/README.md)
#  - scripts/**: utilidades de desarrollo y del pipeline
#  - arranque de Spring y clases de solo datos (DTO y propiedades de configuracion)
sonar.coverage.exclusions=backend/src/test/**,frontend/**,scripts/**,**/TalentmatchApplication.java,**/dto/**,**/config/*Properties.java
