# Configuracion de CodeRabbit (revision automatica de PRs)
language: es
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - develop
      - main
      - revision
chat:
  auto_reply: true
