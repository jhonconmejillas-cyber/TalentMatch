</head>
<body>
  <main class="contenido">

      <div class="titulo-seccion">
        <h1>Habilidades por avalar</h1>
        <label class="ayuda"><input type="checkbox" id="ver-todas"> Ver también las ya revisadas</label>

      <table class="tabla">
        <thead><tr><th>Empleado</th><th>Habilidad</th><th>Nivel declarado</th><th>Agregada</th><th>Estado</th><th></th></tr></thead>
        <tbody id="filas"><tr><td colspan="6" class="vacio">Cargando…</td></tr></tbody>
      </table>
    </section>
  </main>
  <script src="../js/ambiente.js"></script>
  <script type="module" src="../js/pages/avalar.js"></script>
