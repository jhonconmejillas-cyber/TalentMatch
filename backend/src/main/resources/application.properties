# Nombre de la aplicacion (aparece en los logs)
spring.application.name=talentmatch

# ---------------------------------------------------------------
# Parametros de negocio (RNF-12)
# Spring lee estos archivos al arrancar, en este orden:
#   1. config.example.yaml -> valores por defecto (se sube a Git)
#   2. config.yaml         -> copia local de cada uno (NO se sube a Git)
# Si el mismo valor esta en los dos, gana el ULTIMO (config.yaml).
#
# "optional:" = si el archivo no existe, no falla aqui
#               (las clases de config avisan si falta un valor).
# ${TALENTMATCH_CONF_DIR:../conf} = usa la variable de entorno
#   TALENTMATCH_CONF_DIR si existe; si no, la carpeta ../conf
#   (relativa a backend/, desde donde se ejecuta la app).
# ---------------------------------------------------------------
spring.config.import=optional:file:${TALENTMATCH_CONF_DIR:../conf}/config.example.yaml,optional:file:${TALENTMATCH_CONF_DIR:../conf}/config.yaml

# ---------------------------------------------------------------
# CORS: paginas web (origenes) que pueden llamar a esta API.
#   5500  -> Live Server de VS Code
#   63342 -> servidor interno de IntelliJ al abrir un .html
# Al publicar en Cloudflare Pages se agrega aqui su URL.
# ---------------------------------------------------------------
talentmatch.cors.origenes-permitidos=http://localhost:5500,http://127.0.0.1:5500,http://localhost:63342