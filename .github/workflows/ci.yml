# Integracion continua: compila el backend y ejecuta las pruebas JUnit
# en cada Pull Request hacia develop o main. Si falla, el PR no se puede fusionar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Compilar y probar backend
    runs-on: ubuntu-latest

    # Base PostgreSQL de servicio para las pruebas de integracion.
    # Flyway le aplica las migraciones y los datos de prueba al arrancar.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: talentmatch_test
          POSTGRES_USER: talentmatch
          POSTGRES_PASSWORD: talentmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talentmatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/talentmatch_test
      DB_USER: talentmatch
      DB_PASSWORD: talentmatch

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas (mvn verify)
        working-directory: backend
        run: ./mvnw -B verify

      - name: Publicar reporte de pruebas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: backend/target/surefire-reports/
